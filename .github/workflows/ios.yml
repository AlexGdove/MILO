# Сборка iOS-приложения MILO (Capacitor, решение №47) на macOS — без подписи, для симулятора.
# Проверяет, что iOS-проект собирается; артефакт milo-ios-simulator (App.app в zip) запускается
# в симуляторе Xcode. На iPhone (TestFlight / App Store) — после аккаунта Apple Developer:
# подпись и выкладка — отдельной задачей (сертификат и ключ API — секреты репозитория).
name: iOS build

on:
  push:
    branches: [main, dev]
    paths:
      - 'frontend/**'
      - 'mobile/**'
      - 'package-lock.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      VITE_API_URL: ${{ vars.MILO_API_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app (mode mobile) and sync into iOS project
        run: |
          npm run build:web -w mobile
          npm run sync:ios -w mobile

      - name: Xcode version
        run: xcodebuild -version

      # Swift Package Manager (Capacitor 8): пакеты Capacitor берутся из node_modules
      - name: Build for simulator (unsigned)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Pack App.app
        working-directory: mobile/ios/App/build/Build/Products/Debug-iphonesimulator
        run: ditto -c -k --keepParent App.app "$GITHUB_WORKSPACE/milo-ios-simulator.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: milo-ios-simulator
          path: milo-ios-simulator.zip
          retention-days: 14
          if-no-files-found: error
