# CI MILO: те же проверки, что разработчик запускает локально перед коммитом (CLAUDE.md).
# Действия actions/* закреплены по мажорной версии (первая сторона GitHub); сторонние действия,
# если появятся, закреплять полным SHA коммита (рекомендация GitHub по безопасности).
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

# Минимальные права: только чтение кода
permissions:
  contents: read

# Новый запуск для той же ветки отменяет предыдущий
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PostgreSQL и Redis для интеграционных тестов backend (Jest e2e) — как в compose.yaml
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: milo
          POSTGRES_PASSWORD: milo
          POSTGRES_DB: milo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U milo -d milo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://milo:milo@localhost:5432/milo_test
      # Тесты очищают базу Redis — поэтому отдельная база 1 (проверяется в global-setup.js)
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format (Prettier)
        run: npm run format:check

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Test (Vitest + Jest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error
