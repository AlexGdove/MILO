# CI MILO: те же проверки, что разработчик запускает локально перед коммитом (CLAUDE.md).
# Действия actions/* закреплены по мажорной версии (первая сторона GitHub); сторонние действия,
# если появятся, закреплять полным SHA коммита (рекомендация GitHub по безопасности).
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

# Минимальные права: только чтение кода
permissions:
  contents: read

# Новый запуск для той же ветки отменяет предыдущий
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format (Prettier)
        run: npm run format:check

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Test (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error
