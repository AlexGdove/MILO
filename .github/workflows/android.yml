# Сборка Android-приложения MILO (Capacitor, решение №44): отладочный APK как файл запуска.
# Скачать: Actions → «Android APK» → запуск → Artifacts → milo-debug-apk.
# Подписанный релиз для магазинов — отдельной задачей (ключ подписи — секрет репозитория).
name: Android APK

on:
  push:
    branches: [main, dev]
    paths:
      - 'frontend/**'
      - 'mobile/**'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# Минимальные права: только чтение кода
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Адрес сервера для приложения (переменная репозитория). Пока сервер не развёрнут —
      # пусто: поддержка в приложении показывает «недоступна», остальное работает локально
      VITE_API_URL: ${{ vars.MILO_API_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Capacitor 8 / Android Gradle Plugin 8.13 — JDK 21; Android SDK уже есть на раннере
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web app (mode mobile) and sync into Android project
        run: npm run build:mobile

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: milo-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
