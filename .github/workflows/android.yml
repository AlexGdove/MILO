# Сборка Android-приложения MILO (Capacitor, решения №44, №52): release APK, подписанный
# постоянным ключом из секретов репозитория (без секретов — отладочным).
# После каждой сборки из push — и после ручного запуска из main (Run workflow, например после
# смены переменной MILO_API_URL) — файл milo.apk заменяется в релизе android-latest (решение №46) —
# постоянная ссылка для страницы «Приложение», скачивается без входа:
#   https://github.com/AlexGdove/MILO/releases/download/android-latest/milo.apk
# Ещё он лежит как файл запуска: Actions → «Android APK» → Artifacts → milo-apk.
name: Android APK

on:
  push:
    branches: [main, dev]
    paths:
      - 'frontend/**'
      - 'mobile/**'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# Минимальные права: только чтение кода
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Запись — только чтобы заменить файл в релизе android-latest
    permissions:
      contents: write
    env:
      # Адрес сервера для приложения (переменная репозитория). Пока сервер не развёрнут —
      # пусто: поддержка в приложении показывает «недоступна», остальное работает локально
      VITE_API_URL: ${{ vars.MILO_API_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Capacitor 8 / Android Gradle Plugin 8.13 — JDK 21; Android SDK уже есть на раннере
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web app (mode mobile) and sync into Android project
        run: npm run build:mobile

      # Ключ подписи (решение №52) — из секретов репозитория во временный файл раннера, не в git.
      # Без секретов — предупреждение и подпись отладочным ключом (обновление поверх не встанет).
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Нет секрета ANDROID_KEYSTORE_BASE64 — APK подписан отладочным ключом (mobile/README.md, «Ключ подписи»)"
            echo "keystore=" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/milo-release.jks"
            echo "keystore=$RUNNER_TEMP/milo-release.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: mobile/android
        env:
          MILO_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          MILO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MILO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MILO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/milo.apk"

      # Отпечаток сертификата в лог: по нему видно, что подпись постоянная (не меняется от сборки к сборке)
      - name: Show signing certificate
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs milo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: milo-apk
          path: milo.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish to release android-latest
        # Ручной запуск публикует только из main: пробные сборки других веток ссылку не подменяют
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --prerelease --target "$SHA" \
              --title "MILO для Android — последняя сборка" \
              --notes "Сборка из ветки разработки, обновляется автоматически. Скачать: milo.apk."
          fi
          gh release upload android-latest milo.apk --clobber
