# Сборка Android-приложения MILO (Capacitor, решение №44): отладочный APK.
# После каждой сборки из push файл milo.apk заменяется в релизе android-latest (решение №46) —
# постоянная ссылка для страницы «Приложение», скачивается без входа:
#   https://github.com/AlexGdove/MILO/releases/download/android-latest/milo.apk
# Ещё он лежит как файл запуска: Actions → «Android APK» → Artifacts → milo-debug-apk.
# Подписанный релиз для магазинов — отдельной задачей (ключ подписи — секрет репозитория).
name: Android APK

on:
  push:
    branches: [main, dev]
    paths:
      - 'frontend/**'
      - 'mobile/**'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# Минимальные права: только чтение кода
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Запись — только чтобы заменить файл в релизе android-latest
    permissions:
      contents: write
    env:
      # Адрес сервера для приложения (переменная репозитория). Пока сервер не развёрнут —
      # пусто: поддержка в приложении показывает «недоступна», остальное работает локально
      VITE_API_URL: ${{ vars.MILO_API_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Capacitor 8 / Android Gradle Plugin 8.13 — JDK 21; Android SDK уже есть на раннере
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web app (mode mobile) and sync into Android project
        run: npm run build:mobile

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: milo-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish to release android-latest
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk milo.apk
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --prerelease --target "$SHA" \
              --title "MILO для Android — последняя сборка" \
              --notes "Отладочная сборка из ветки разработки, обновляется автоматически. Скачать: milo.apk."
          fi
          gh release upload android-latest milo.apk --clobber
