<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2F3BD9" />
    <meta name="description" content="Питание, кладовая, рецепты и покупки" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>MILO</title>
    <script>
      // Тема из профиля — до первой отрисовки, без вспышки светлой темы.
      // Ключ и формат — features/switch-theme (zustand persist: { state: { theme } }).
      try {
        var saved = JSON.parse(localStorage.getItem('milo:theme') || 'null');
        var theme = saved && saved.state && saved.state.theme;
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {
        // хранилище недоступно — тема как в системе
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/index.tsx"></script>
  </body>
</html>
