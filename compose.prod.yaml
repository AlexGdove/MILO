# MILO на сервере (этап 11, решение B-22): Caddy (HTTPS, PWA) → backend → PostgreSQL и Redis.
# Наружу открыты только 80 и 443 (Caddy); база и Redis — во внутренней сети.
# Настройки — в файле .env рядом с этим (не в git, пример — .env.example).
#   docker compose -f compose.prod.yaml up -d --build
# Защита (B-24): логи с ротацией, лимиты памяти (рассчитаны на VPS от 2 ГБ), без повышения прав.
name: milo-prod

# Общее для всех сервисов: логи не больше 3 × 10 МБ на сервис — иначе со временем (или под
# потоком мусорных запросов) заполнят диск; процессы не получают новых прав (setuid и т. п.)
x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: milo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: milo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U milo -d milo']
      interval: 5s
      timeout: 3s
      retries: 10

  # Счётчики лимитов и кэш Open Food Facts: на диск не сохраняются. У всех ключей есть срок
  # жизни — при нехватке памяти вытесняются ближайшие к истечению, а не падает запись
  redis:
    <<: *defaults
    image: redis:8-alpine
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'volatile-ttl',
      ]
    mem_limit: 192m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Миграции базы перед запуском backend; завершается после применения
  migrate:
    <<: *defaults
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://milo:${POSTGRES_PASSWORD}@postgres:5432/milo
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    restart: 'no'

  backend:
    <<: *defaults
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: runtime
    # Файловая система только для чтения: даже при уязвимости в коде нечего подменить на диске
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    mem_limit: 512m
    environment:
      NODE_ENV: production
      # Куча Node меньше лимита контейнера — сборка мусора раньше, чем контейнер убьют за память
      NODE_OPTIONS: --max-old-space-size=384
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://milo:${POSTGRES_PASSWORD}@postgres:5432/milo
      REDIS_URL: redis://redis:6379/0
      # Перед backend — один прокси (Caddy): IP клиента для лимитов берётся из X-Forwarded-For
      TRUST_PROXY: 1
      CORS_ORIGINS: https://${DOMAIN},https://localhost,capacitor://localhost
      TELEGRAM_SUPPORT_BOT_TOKEN: ${TELEGRAM_SUPPORT_BOT_TOKEN:-}
      TELEGRAM_SUPPORT_CHAT_ID: ${TELEGRAM_SUPPORT_CHAT_ID:-}
      TELEGRAM_SUPPORT_THREAD_ID: ${TELEGRAM_SUPPORT_THREAD_ID:-}
      TELEGRAM_MODERATION_BOT_TOKEN: ${TELEGRAM_MODERATION_BOT_TOKEN:-}
      TELEGRAM_MODERATION_CHAT_ID: ${TELEGRAM_MODERATION_CHAT_ID:-}
      TELEGRAM_MODERATION_THREAD_ID: ${TELEGRAM_MODERATION_THREAD_ID:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    <<: *defaults
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    read_only: true
    cap_drop:
      - ALL
    # Только привязка к портам 80 и 443
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 128m
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      # Сертификаты Let's Encrypt: без тома Caddy запрашивал бы их при каждом запуске
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
